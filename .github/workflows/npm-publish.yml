name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub Release tag to retry (for example v0.5.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to npm with OIDC
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual publication must use the main workflow.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'A version tag is required.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          if ! jq -e --arg tag "$RELEASE_TAG" '.draft == false and .published_at != null and .tag_name == $tag' "$RUNNER_TEMP/release.json" > /dev/null; then
            echo 'Only an existing published GitHub Release can be published to npm.' >&2
            exit 1
          fi

      - name: Checkout the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Setup package managers
        run: |
          corepack enable
          npm install --global npm@12.0.1

      - name: Install dependencies without release caches
        run: yarn install --immutable

      - name: Verify release identity
        id: release
        run: |
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo 'Checked out source does not match the exact release tag.' >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag $RELEASE_TAG is not reachable from main" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main; then
            echo 'Release tooling must come from a commit reachable from main.' >&2
            exit 1
          fi
          echo "Release source: $(git rev-parse HEAD); workflow tooling: $WORKFLOW_SHA"

          if npm view "react-native-bs-diff-patch@$package_version" version --json --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/registry-version.json"; then
            echo "react-native-bs-diff-patch@$package_version is already published" >&2
            exit 1
          elif ! jq -e '.error.code == "E404"' "$RUNNER_TEMP/registry-version.json" > /dev/null; then
            echo 'Cannot confirm that the release version is absent from npm; refusing to publish.' >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            prerelease="${package_version#*-}"
            dist_tag="${prerelease%%.*}"
          else
            dist_tag=latest
          fi
          if [[ ! "$dist_tag" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "Derived npm dist-tag $dist_tag is invalid" >&2
            exit 1
          fi
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Run release quality gates
        run: |
          # A retry can fix this unpackaged consumer harness without moving the
          # release tag. Restore it before publication so only tag source ships.
          git show "$WORKFLOW_SHA:scripts/test-sdk-consumers.mjs" > scripts/test-sdk-consumers.mjs
          yarn prepare
          yarn typecheck
          yarn lint
          yarn test --runInBand
          yarn test:native-operations
          FUZZ_RUNS=2000 yarn test:fuzz
          yarn test:web
          yarn test:web:browser
          yarn test:web:metro
          yarn test:toolkit
          yarn test:node
          yarn test:action
          yarn test:package
          yarn test:sdk
          git show HEAD:scripts/test-sdk-consumers.mjs > scripts/test-sdk-consumers.mjs
          git diff --exit-code HEAD
          npm pack --dry-run --ignore-scripts
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Publish with provenance
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Verify registry provenance metadata
        run: |
          package_version="${{ steps.release.outputs.package_version }}"
          for _ in $(seq 1 12); do
            predicate_type="$(npm view "react-native-bs-diff-patch@$package_version" dist.attestations.provenance.predicateType 2>/dev/null || true)"
            if [[ "$predicate_type" == "https://slsa.dev/provenance/v1" ]]; then
              echo "Verified provenance for react-native-bs-diff-patch@$package_version"
              exit 0
            fi
            sleep 5
          done
          echo 'Published package did not expose provenance metadata in time.' >&2
          exit 1

      - name: Smoke test the published SDK
        env:
          PACKAGE_SPEC: react-native-bs-diff-patch@${{ steps.release.outputs.package_version }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          git show "$WORKFLOW_SHA:scripts/test-sdk-consumers.mjs" > scripts/test-sdk-consumers.mjs
          yarn test:sdk
